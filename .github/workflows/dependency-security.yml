name: Dependency Security Scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run OSV scanner
        id: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --output-file=results.json
            --format=json
            --recursive
            ./

      - name: Generate OSV SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@v2.3.8
        with:
          scan-args: |-
            --output-files=sarif:results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  dependency-check:
    name: OWASP Dependency-Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:12.2.1:check \
            -Dformat=JSON \
            -DfailBuildOnCVSS=11 \
            -DassemblyAnalyzerEnabled=false

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: target/dependency-check-report.json
          if-no-files-found: ignore
